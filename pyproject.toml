[project]
name = "mini-harness"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["textual>=0.60"]

[project.scripts]
harness = "agent:main"

[tool.setuptools]
py-modules = ["agent", "model", "model_registry", "tools", "ui", "tui"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
